<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1402 1122" width="100%" height="100%">
  <title>托尼托尼·乔巴的帽子 (完整版含鹿角与耳朵)</title>
  <defs>
    <style>
      .hat-fill-red {
        fill: #E62846;
        stroke: #1E1012;
        stroke-width: 14px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hat-fill-dark-red {
        fill: #B41D32;
        stroke: #1E1012;
        stroke-width: 13px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hat-cross {
        fill: #FFFFFF;
        stroke: #1E1012;
        stroke-width: 14px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hat-antler {
        fill: #A05C30;
        stroke: #1E1012;
        stroke-width: 14px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .antler-line {
        fill: none;
        stroke: #1E1012;
        stroke-width: 11px;
        stroke-linecap: round;
      }
      .hat-ear {
        fill: #F0BC80;
        stroke: #1E1012;
        stroke-width: 14px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <!-- 左鹿角定义 -->
    <g id="left-antler-group">
      <path class="hat-antler" d="M 49 332 L 34 368 L 35 406 L 45 448 L 76 514 L 120 563 L 171 594 L 235 612 L 306 615 L 384 604 L 376 548 L 347 547 L 318 538 L 294 522 L 283 506 L 312 443 L 327 374 L 320 276 L 309 240 L 292 217 L 277 210 L 253 212 L 231 228 L 224 243 L 238 404 L 232 440 L 221 454 L 203 446 L 191 418 L 181 359 L 181 289 L 170 270 L 156 264 L 129 269 L 114 288 L 109 310 L 115 387 L 132 441 L 152 478 L 149 484 L 135 471 L 113 422 L 98 339 L 74 323 Z" />
      <path class="antler-line" d="M 166 298 C 172 345, 188 410, 218 455" />
    </g>

    <!-- 左耳朵定义 -->
    <path id="left-ear" class="hat-ear" d="M 386 620 L 384 618 L 366 620 L 339 629 L 287 659 L 286 665 L 292 676 L 298 682 L 308 689 L 309 688 L 310 690 L 327 697 L 342 700 L 348 699 L 364 700 L 380 697 L 391 693 L 394 690 L 386 629 Z" />
  </defs>

  <!-- === 背景层：鹿角与耳朵 === -->
  <g id="antlers-and-ears">
    <!-- 左鹿角 -->
    <use href="#left-antler-group" />
    <!-- 右鹿角 (水平镜像对称) -->
    <use href="#left-antler-group" transform="translate(1402, 0) scale(-1, 1)" />

    <!-- 左耳朵 -->
    <use href="#left-ear" />
    <!-- 右耳朵 (水平镜像对称) -->
    <use href="#left-ear" transform="translate(1402, 0) scale(-1, 1)" />
  </g>

  <!-- === 前景层：帽子主体 === -->
  <g id="chopper-hat">
    <!-- 1. 帽身 -->
    <path id="hat-crown" class="hat-fill-red" d="M 356 265 Q 360 242 382 238 C 480 216, 922 216, 1020 238 Q 1042 242 1046 265 C 1032 390, 1008 560, 994 750 L 408 750 C 394 560, 370 390, 356 265 Z" />

    <!-- 2. 标志白色十字 -->
    <path id="hat-cross" class="hat-cross" d="M 600 362 L 536 427 L 634 517 L 536 607 L 600 672 L 701 581 L 802 672 L 866 607 L 768 517 L 866 427 L 802 362 L 701 453 Z" />

    <!-- 3. 帽檐正面 -->
    <path id="hat-brim-shell" class="hat-fill-red" d="M 248 825 C 380 745, 540 709, 701 709 C 862 709, 1022 745, 1154 825 Q 1164 846 1136 868 C 1010 918, 860 926, 701 926 C 542 926, 392 918, 266 868 Q 238 846 248 825 Z" />

    <!-- 4. 帽檐内部阴影开口 -->
    <path id="hat-brim-opening" class="hat-fill-dark-red" d="M 318 893 C 440 852, 570 836, 701 836 C 832 836, 962 852, 1084 893 C 962 922, 832 926, 701 926 C 570 926, 440 922, 318 893 Z" />
  </g>
</svg>
