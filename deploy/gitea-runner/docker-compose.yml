# Gitea Runner (act_runner) Docker 部署
#
# 使用方式：
# 1. 复制 .env.example 为 .env 并填入 GITEA_INSTANCE_URL 和 GITEA_RUNNER_REGISTRATION_TOKEN
# 2. 执行 docker compose up -d 即可启动 Runner 并自动向 Gitea 注册

services:
  runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: always
    environment:
      - CONFIG_FILE=/config.yaml
      - GITEA_INSTANCE_URL=${GITEA_INSTANCE_URL:-http://kongfu-onedrive.kooka-salmon.ts.net:23000}
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
      - GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME:-realtime-chopper-runner}
    volumes:
      # 挂载 Docker Socket，赋予 Runner 调用宿主机 Docker 构建/部署容器的权限
      - /var/run/docker.sock:/var/run/docker.sock
      # Runner 的注册信息和状态持久化目录
      - ./data:/data
      # 挂载自定义配置文件
      - ./config.yaml:/config.yaml
