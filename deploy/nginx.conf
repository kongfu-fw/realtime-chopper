# 这个容器只做一件事：把 vite 构建出来的 dist/ 发出去。
#
# 应用没有后端 —— 录音、识别、翻译、朗读都在浏览器里跑（见 DOCKER.md）。
# 所以这里真正要小心的只有两件事：
#   1. .wasm 的 MIME 类型（认错会让浏览器放弃流式编译）；
#   2. 缓存策略（发新版本时不能把旧界面留在用户的浏览器和 Service Worker 里）。
#
# 顺带一个写法上的约定：下面各 location 只用 `expires` 设缓存头，不用
# `add_header`。因为 nginx 的 add_header 是"子级一旦出现就不再继承父级"，
# 如果用 add_header 写 Cache-Control，server 级那两条安全头就会在那些
# location 里静默消失。

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # 单个最大的文件是 26 MB 的 onnxruntime wasm，压缩收益最大。
  # text/html 是 nginx 内置一定会压的，不用列。
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;

  # 容器自己的健康检查（docker compose ps 里的 healthy 就是它），不进访问日志。
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 构建产物带内容哈希（index-<hash>.js）：内容变了文件名就变，可以永久缓存。
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # nginx 自带的 mime.types 在旧版本里不认识 .wasm。类型不对时
  # WebAssembly.instantiateStreaming 会直接拒绝（还能跑，但要多绕一圈内存）。
  # 在这个 location 里单独声明类型，不依赖基础镜像的 nginx 版本。
  location ~* \.wasm$ {
    types { application/wasm wasm; }
    expires 1y;
    try_files $uri =404;
  }

  # 不带哈希的"外壳"文件：每次部署内容都可能变，必须回源校验。
  # sw.js 尤其重要 —— 它自己不缓存自己，但它会把整个外壳缓存起来。
  location = /index.html       { expires -1; }
  location = /sw.js            { expires -1; }
  location = /zh-asr.worker.js { expires -1; }
  # 图标：根目录那套是默认图标，icons/ 下每款一份（见 scripts/make-icons.mjs），
  # 另外 chopper-* 是设置里可选的原始素材。内容会随版本换，但也别每次请求都回源，折中一天。
  location ^~ /icons/ {
    expires 1d;
  }

  location ~ ^/(icon(-\d+)?(-maskable-\d+)?\.png|apple-touch-icon\.png|icon\.svg|chopper-[^/]+\.(svg|jpe?g|png))$ {
    expires 1d;
  }

  # manifest 同样按上面的理由显式声明类型：类型不对时 Chrome 会拒绝把它
  # 当成 PWA 清单（"添加到主屏幕"就变成普通书签）。
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    expires -1;
  }

  # 其余静态文件由 root + index 直出（`/` 会拿到 index.html，缺失就是 404）。
  #
  # 这里刻意没有 `try_files $uri /index.html` 那种 SPA 回退：应用没有任何前端
  # 路由（设置页只是同一页里的状态切换），回退只会把"资源路径写错"伪装成
  # 一个看起来正常的 200 HTML，难查得多。
}
