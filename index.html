<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#FDFBF4" />
    <!-- iOS PWA: run standalone from the home screen (also exempts storage from ITP eviction). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="乔巴" />
    <link rel="icon" id="rc-favicon" type="image/svg+xml" href="./icon.svg" />
    <!--
      iOS never took SVG here: without this link it screenshots the page for the
      home-screen icon. 180 is the size Apple asks for, and the file is written
      by scripts/make-icons.mjs — the default icon, once the page has run and
      knows which icon the user actually chose (see src/lib/brand/apply.ts).
    -->
    <link
      id="rc-apple-touch"
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link rel="manifest" id="rc-manifest" href="./manifest.webmanifest" />
    <title>乔巴 · 实时翻译</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
