name: Deploy Dev to Docker

on:
  # 1. 自动触发：当 dev 分支发生 push 时自动执行
  push:
    branches:
      - dev

  # 2. 手动触发：可在 Gitea 网页端的 Actions 页面点击 "Run workflow" 手动执行
  workflow_dispatch:
    inputs:
      target_branch:
        description: '部署目标分支'
        required: true
        default: 'dev'
      port:
        description: '容器映射端口 (RC_PORT)'
        required: false
        default: '8080'
      no_cache:
        description: '强制无缓存重新构建 (no-cache)'
        type: boolean
        required: false
        default: false

# 避免并发部署造成冲突
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: host

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 自动触发时使用当前触发分支，手动触发时使用表单选择的分支
          ref: ${{ inputs.target_branch || github.ref }}

      - name: Run Deployment
        env:
          COMPOSE_PROJECT_NAME: realtime-chopper
          RC_PORT: ${{ inputs.port || '8080' }}
          NO_CACHE: ${{ inputs.no_cache || 'false' }}
          HEALTHCHECK_TIMEOUT: 60
        run: |
          chmod +x ./deploy/deploy.sh
          ./deploy/deploy.sh
