name: Deploy Dev to Docker

on:
  # 自动触发：当 dev 分支更新（push）时自动运行
  push:
    branches:
      - dev

  # 手动触发：可在 Gitea Actions 网页端点击 "Run workflow" 手动运行
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Container
        run: |
          echo "🚀 开始构建并启动新容器..."
          docker compose up -d --build --remove-orphans

          echo "🧹 清理旧镜像..."
          docker image prune -f

          echo "✅ 部署完成！服务运行在 http://127.0.0.1:8080"
